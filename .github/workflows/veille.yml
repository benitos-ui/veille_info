name: Veille quotidienne
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 08:00 au Bénin
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
        
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Lancer la veille
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py
      - name: Sauvegarder les résultats
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data docs rapport
          git diff --cached --quiet || git commit -m "Veille du $(date +%F)"
          git push
